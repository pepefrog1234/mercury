name: Modem packages

on:
  push:
    branches:
      - mercuryv2
  pull_request:
    branches:
      - mercuryv2
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  linux-debian-amd64:
    name: Linux Debian 13.5 amd64
    runs-on: ubuntu-24.04
    container:
      image: debian:13.5
    timeout-minutes: 20

    steps:
      - name: Install checkout tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates \
            git

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Debian amd64 environment
        run: |
          . /etc/os-release
          echo "Debian $VERSION_ID / $(dpkg --print-architecture)"
          test "$VERSION_ID" = "13"
          test "$(dpkg --print-architecture)" = "amd64"

      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            file \
            libasound2-dev \
            libhamlib-dev \
            libpulse-dev

      - name: Build
        run: |
          make clean
          make -j"$(nproc)"

      - name: Unit tests
        run: make test

      - name: Package
        run: |
          short_sha="$(git rev-parse --short=8 HEAD)"
          version="$(grep 'define VERSION__' main.c | head -1 | sed 's/.*"\(.*\)".*/\1/')"
          package_name="mercury-$version-linux-debian13.5-amd64-$short_sha"
          package_dir="dist/$package_name"
          mkdir -p "$package_dir"

          cp mercury "$package_dir/"
          cp mercury.ini.example "$package_dir/"
          cp mercury.1 "$package_dir/"
          cp LICENSE LICENSE-freedv "$package_dir/"
          file "$package_dir/mercury" > "$package_dir/BINARY-INFO.txt"
          ldd "$package_dir/mercury" > "$package_dir/RUNTIME-LIBS.txt"

          cat > "$package_dir/README-DEBIAN.txt" <<EOF
          Mercury modem Linux Debian 13.5 amd64 package

          Run:
            ./mercury

          Runtime dependencies:
            sudo apt-get install libasound2t64 libhamlib4t64 libpulse0

          Build metadata:
            Mercury commit: $GITHUB_SHA
            Debian image: debian:13.5
            Architecture: amd64
            Hamlib CAT support: enabled
          EOF

          tar -C dist -czf "dist/$package_name.tar.gz" "$package_name"
          echo "PACKAGE_TGZ=dist/$package_name.tar.gz" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mercury-modem-linux-debian13.5-amd64
          path: ${{ env.PACKAGE_TGZ }}
          if-no-files-found: error

  windows-x64:
    name: Windows x64
    runs-on: ubuntu-24.04
    container:
      image: debian:13.5
    timeout-minutes: 20

    steps:
      - name: Install checkout tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates \
            git

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Debian amd64 environment
        run: |
          . /etc/os-release
          echo "Debian $VERSION_ID / $(dpkg --print-architecture)"
          test "$VERSION_ID" = "13"
          test "$(dpkg --print-architecture)" = "amd64"

      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            file \
            gcc-mingw-w64-x86-64 \
            mingw-w64-common \
            mingw-w64-tools \
            mingw-w64-x86-64-dev \
            zip

      - name: Build Windows zip
        run: make windows-zip

      - name: Verify Windows binary
        run: |
          file mercury.exe
          zip_file="$(ls mercury-*-w64-*.zip | head -1)"
          test -n "$zip_file"
          echo "PACKAGE_ZIP=$zip_file" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mercury-modem-windows-x64
          path: ${{ env.PACKAGE_ZIP }}
          if-no-files-found: error
