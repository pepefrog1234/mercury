name: Unit tests

on:
  push:
    branches:
      - mercuryv2
  pull_request:
    branches:
      - mercuryv2
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  unit-tests:
    name: Unit tests Linux Debian 13.5 amd64
    runs-on: ubuntu-24.04
    container:
      image: debian:13.5
    timeout-minutes: 20

    steps:
      - name: Install checkout tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates \
            git

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify Debian amd64 environment
        run: |
          . /etc/os-release
          echo "Debian $VERSION_ID / $(dpkg --print-architecture)"
          test "$VERSION_ID" = "13"
          test "$(dpkg --print-architecture)" = "amd64"

      - name: Install test dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential

      - name: Run unit tests
        run: |
          make -C tests clean
          make test
